<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Tetris</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
  }
  .game {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  canvas {
    background: #181818;
    border: 3px solid #555;
    display: block;
  }
  .panel {
    width: 150px;
  }
  h1 { margin: 0 0 15px; font-size: 24px; }
  .score {
    font-size: 18px;
    margin-bottom: 20px;
  }
  button {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  .help {
    font-size: 13px;
    line-height: 1.7;
    color: #bbb;
  }
</style>
</head>
<body>

<div class="game">
  <canvas id="tetris" width="240" height="480"></canvas>

  <div class="panel">
    <h1>Tetris</h1>
    <div class="score">Score: <span id="score">0</span></div>
    <button onclick="restart()">Restart</button>
    <div class="help">
      ← → Move<br>
      ↓ Drop faster<br>
      ↑ Rotate<br>
      Space = Hard drop<br>
      P = Pause
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("tetris");
const ctx = canvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const SIZE = 24;

const colors = [
  null,
  "#00f0f0", // I
  "#f0f000", // O
  "#a000f0", // T
  "#00f000", // S
  "#f00000", // Z
  "#0000f0", // J
  "#f0a000"  // L
];

const shapes = [
  [],
  [[1,1,1,1]],
  [[2,2],[2,2]],
  [[0,3,0],[3,3,3]],
  [[0,4,4],[4,4,0]],
  [[5,5,0],[0,5,5]],
  [[6,0,0],[6,6,6]],
  [[0,0,7],[7,7,7]]
];

let board;
let piece;
let score;
let dropCounter;
let lastTime;
let dropInterval;
let paused;
let gameOver;

function createBoard() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(0));
}

function randomPiece() {
  const type = Math.floor(Math.random() * 7) + 1;
  return {
    matrix: shapes[type].map(row => row.slice()),
    x: Math.floor(COLS / 2) - Math.ceil(shapes[type][0].length / 2),
    y: 0
  };
}

function collision(p) {
  for (let y = 0; y < p.matrix.length; y++) {
    for (let x = 0; x < p.matrix[y].length; x++) {
      if (!p.matrix[y][x]) continue;
      const nx = p.x + x;
      const ny = p.y + y;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && board[ny][nx]) return true;
    }
  }
  return false;
}

function merge() {
  piece.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value) board[piece.y + y][piece.x + x] = value;
    });
  });
}

function clearLines() {
  let lines = 0;
  outer:
  for (let y = ROWS - 1; y >= 0; y--) {
    for (let x = 0; x < COLS; x++) {
      if (!board[y][x]) continue outer;
    }
    board.splice(y, 1);
    board.unshift(Array(COLS).fill(0));
    y++;
    lines++;
  }

  if (lines === 1) score += 100;
  if (lines === 2) score += 300;
  if (lines === 3) score += 500;
  if (lines >= 4) score += 800;

  document.getElementById("score").textContent = score;
}

function rotate(matrix) {
  return matrix[0].map((_, i) =>
    matrix.map(row => row[i]).reverse()
  );
}

function rotatePiece() {
  const old = piece.matrix;
  const oldX = piece.x;
  piece.matrix = rotate(piece.matrix);

  // Simple wall kick
  if (collision(piece)) {
    piece.x += 1;
    if (collision(piece)) {
      piece.x = oldX - 1;
      if (collision(piece)) {
        piece.x = oldX;
        piece.matrix = old;
      }
    }
  }
}

function move(dir) {
  piece.x += dir;
  if (collision(piece)) piece.x -= dir;
}

function drop() {
  piece.y++;
  if (collision(piece)) {
    piece.y--;
    merge();
    clearLines();
    piece = randomPiece();

    if (collision(piece)) {
      gameOver = true;
    }
  }
  dropCounter = 0;
}

function hardDrop() {
  while (!collision(piece)) piece.y++;
  piece.y--;
  drop();
}

function drawCell(x, y, value) {
  ctx.fillStyle = colors[value];
  ctx.fillRect(x * SIZE, y * SIZE, SIZE, SIZE);

  ctx.strokeStyle = "#222";
  ctx.strokeRect(x * SIZE, y * SIZE, SIZE, SIZE);

  // Small highlight
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(x * SIZE + 2, y * SIZE + 2, SIZE - 4, 4);
}

function drawMatrix(matrix, offsetX, offsetY) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value) drawCell(x + offsetX, y + offsetY, value);
    });
  });
}

function draw() {
  ctx.fillStyle = "#181818";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawMatrix(board, 0, 0);

  if (!gameOver) {
    drawMatrix(piece.matrix, piece.x, piece.y);
  }

  if (paused || gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "bold 28px Arial";
    ctx.fillText(gameOver ? "GAME OVER" : "PAUSED", canvas.width / 2, canvas.height / 2);

    ctx.font = "14px Arial";
    ctx.fillText(
      gameOver ? "Press R to restart" : "Press P to continue",
      canvas.width / 2,
      canvas.height / 2 + 30
    );
  }
}

function update(time = 0) {
  const delta = time - lastTime;
  lastTime = time;

  if (!paused && !gameOver) {
    dropCounter += delta;
    if (dropCounter > dropInterval) drop();
  }

  draw();
  requestAnimationFrame(update);
}

function restart() {
  board = createBoard();
  piece = randomPiece();
  score = 0;
  dropCounter = 0;
  dropInterval = 700;
  paused = false;
  gameOver = false;
  document.getElementById("score").textContent = score;
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (!paused && !gameOver) move(-1);
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    if (!paused && !gameOver) move(1);
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    if (!paused && !gameOver) drop();
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (!paused && !gameOver) rotatePiece();
  } else if (e.code === "Space") {
    e.preventDefault();
    if (!paused && !gameOver) hardDrop();
  } else if (e.key.toLowerCase() === "p") {
    paused = !paused;
  } else if (e.key.toLowerCase() === "r") {
    restart();
  }
});

restart();
update();
</script>
</body>
</html>
